[pack]
slug = "standard"
name = "Standard Statement of Work (plain English)"
version = "2.0"
kind = "sow"
default_clauses = ["reference", "description", "deliverables", "fees", "timing", "acceptance", "assumptions", "signature_note"]

[clauses.reference]
heading = "Master agreement and precedence"
body = """
This SOW is entered into by {{our_legal_name}} (the “Provider”) and {{their_legal_name}} (the “Client”) under the signed master services agreement identified as {{msa_reference}}. Its terms apply to this SOW. This SOW controls the project scope, deliverables, fees and schedule. It changes other MSA provisions only where it identifies the provision and states the agreed change expressly; otherwise the MSA prevails.
"""

[clauses.description]
heading = "Project Description"
body = """
{{purpose}}
"""

[clauses.deliverables]
heading = "Deliverables"
body = """
The Provider will deliver the following:

{{deliverables_block}}
"""

[clauses.fees]
heading = "Fees"
body = """
{{fee_text}}.

Invoices are payable within 14 days of receipt. Reasonable out-of-pocket expenses are reimbursable when pre-approved in writing.
"""

[clauses.timing]
heading = "Timing"
body = """
Work begins on {{effective_date}} and runs {{term_text}}. Specific milestones, if any, are listed under Deliverables.
"""

[clauses.acceptance]
heading = "Review and acceptance"
body = """
Acceptance shall be assessed against the deliverables and objective acceptance criteria expressly agreed in writing. Within {{acceptance_days}} business days after delivery, the {{their_role}} shall confirm acceptance or give written details of material non-conformities against those criteria. The {{our_role}} shall correct those non-conformities at its own cost within a reasonable period and resubmit for review. Silence alone is not acceptance. A minor defect that does not materially prevent the agreed use shall not justify rejecting otherwise conforming work, but must be corrected. Acceptance does not waive rights relating to latent defects or express warranties. Changes to agreed criteria or additional work require a written change order setting out fees and timing.
"""

[clauses.assumptions]
heading = "Assumptions"
body = """
This SOW is based on the Provider receiving timely access, feedback, and inputs from the Client. Material delays or changes to the inputs may impact timing and fees; any such impact will be agreed in writing before extra work is performed.
"""

[clauses.signature_note]
heading = "Authority"
body = """
By signing below, each signatory confirms they are authorised to sign on behalf of their organisation and to bind that organisation to this SOW.
"""
