[pack]
slug = "standard"
name = "Standard Service Agreement (plain English, ongoing)"
version = "2.0"
kind = "service"
default_clauses = ["background", "services", "fees", "term_renewal", "support_changes", "data_handling", "warranties", "liability", "termination", "general", "confidentiality", "data_protection", "ip_ownership"]

[clauses.background]
heading = "Background"
body = """
{{our_legal_name}} (the “Provider”) supplies the services described below. {{their_legal_name}} (the “Customer”) wishes to receive them on the terms set out in this agreement.
"""

[clauses.services]
heading = "Services"
body = """
The Provider will supply: {{purpose}}.

{{deliverables_block}}
"""

[clauses.fees]
heading = "Fees"
body = """
{{fee_text}}.

Fees are payable within 14 days of invoice. Statutory interest and recovery costs may be claimed only to the extent available under applicable law; no additional contractual default interest is imposed. Taxes are added where the Provider is required to charge them.
"""

[clauses.term_renewal]
heading = "Term and Renewal"
body = """
This agreement starts on {{effective_date}} and continues {{term_text}}. A fixed term ends on expiry unless the parties expressly agree a renewal in writing, including its length, fees and notice requirements. There is no automatic renewal. An indefinite engagement may be terminated under the Termination clause.
"""

[clauses.support_changes]
heading = "Support and Changes"
body = """
The Provider will use commercially reasonable efforts to keep the services available and to respond to support requests during normal business hours. The Provider may change non-material features from time to time. Material changes that reduce the services available to the Customer will be communicated in advance, and the Customer may terminate this agreement (without fee) within 30 days of such a change.
"""

[clauses.data_handling]
heading = "Data Handling"
body = """
The Provider will handle Customer data with reasonable care, will not use it for any purpose other than providing the services and complying with law, and will apply appropriate technical and organisational security measures. The Customer remains the owner of its data. On termination, the Provider will return or delete Customer data within a reasonable period, except as required by law or routine backups.
"""

[clauses.warranties]
heading = "Warranties"
body = """
The Provider warrants that it will perform the services with reasonable skill and care. The Provider does not warrant that the services will be uninterrupted or error-free.
"""

[clauses.liability]
heading = "Liability"
body = """
Neither party is liable for indirect or consequential loss. Subject to the exclusions below, each party's total aggregate liability arising out of or in connection with this agreement, whether in contract, tort (including negligence), misrepresentation or otherwise, shall not exceed the total fees paid or payable under this agreement. This cap does not reduce the obligation to pay properly due fees.

Nothing excludes or limits liability for death or personal injury caused by negligence, fraud or fraudulent misrepresentation, or any liability that applicable law does not permit to be excluded or limited. Any restriction applies only to the extent lawful and, where required, reasonable. A separate signed SOW may expressly agree a different cap for that SOW; it must identify this clause and the replacement cap.
"""

[clauses.termination]
heading = "Termination"
body = """
Either party may terminate this agreement immediately for material breach not cured within 15 days of written notice, or, to the extent permitted by applicable insolvency law, if the other party becomes insolvent. The Customer may terminate for convenience by giving the Provider at least {{termination_notice_days}} days’ written notice. The Customer remains liable for fees up to the termination date.
"""

[clauses.general]
heading = "General provisions"
body = """
This agreement is the entire agreement on its subject and supersedes earlier discussions; nothing excludes liability for fraud or fraudulent misrepresentation. Amendments must be in writing and agreed by authorised representatives of both parties. An exchange of emails expressly agreeing a change is sufficient, except where law requires a different formality. A delay in enforcing a right is not a waiver. If a provision is unenforceable, the remaining provisions continue in effect. Assignment of rights requires the other party's written consent, not to be unreasonably withheld; transfer of obligations requires a written novation agreed by all affected parties. No person other than the parties may enforce this agreement except where mandatory law provides otherwise.

Notices shall be sent to the contact email or postal address identified in the Parties section, or a replacement notified in writing. Email notices take effect when receipt is acknowledged by the recipient, excluding automated responses; if not acknowledged, the sender must use delivery with evidence of receipt. This notice method does not govern service of court proceedings. This agreement may be signed in counterparts and by electronic signature where permitted by law. Each signatory confirms authority to bind the relevant party. Recording a signatory's name in software does not itself establish consent or authority.

This agreement and non-contractual obligations arising from it are governed by the laws of {{governing_law}}. The parties submit to the exclusive jurisdiction of {{jurisdiction_phrase}}, without preventing urgent interim relief from another court with competent jurisdiction.
"""

[clauses.confidentiality]
heading = "Confidentiality"
body = """
Each party shall protect the other party's non-public information with reasonable care, use it only to perform this agreement, and disclose it only to personnel, subcontractors and professional advisers who need it for that purpose and owe equivalent duties of confidence. Each party remains responsible for those recipients. These duties do not cover information demonstrably public without breach, already lawfully known without restriction, independently developed, or lawfully received from a third party without restriction. Legally required disclosures are permitted to the minimum extent required, with prior notice where lawful. Nothing restricts protected disclosures to regulators, law enforcement or legal advisers, or the reporting of wrongdoing protected by applicable law. The duties last for {{confidentiality_years}} years after termination, and for trade secrets while they remain protected by applicable law. On request, confidential material shall be returned or deleted, subject to legal retention and inaccessible routine backups, which remain protected.
"""

[clauses.data_protection]
heading = "Data protection and security"
body = """
Each party shall comply with applicable data protection law. The parties shall identify their respective controller and processor roles before sharing personal data. Where one party processes personal data on behalf of the other, processing must not begin until they have signed a data processing schedule covering the subject matter, duration, purpose, data types and data subjects; documented instructions; confidentiality; security; approved subprocessors; assistance with rights, breaches and impact assessments; audit information; deletion or return; and lawful international transfers. This agreement alone does not authorise such processing or supply that schedule.

Neither party may put the other party's confidential information or personal data into a public or third-party AI service without prior written authorisation and agreement on retention, training use, security and subprocessors. Each party shall notify the other without undue delay of a security incident affecting the other's information and cooperate in containment and recovery.
"""

[clauses.ip_ownership]
heading = "Intellectual property"
body = """
{{ip_assignment_text}}
"""
