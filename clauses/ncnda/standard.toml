[pack]
slug = "standard"
name = "Standard Non-Circumvention & Non-Disclosure Agreement (plain English)"
version = "2.0"
kind = "ncnda"
default_clauses = ["purpose", "definitions", "confidentiality", "permitted_disclosures", "non_circumvention", "introducer_role", "prior_dealings", "remedies", "no_obligation", "term", "entire_agreement", "variation", "assignment", "severance", "third_party_rights", "notices", "no_partnership", "counterparts", "governing_law"]

[clauses.purpose]
heading = "Purpose"
body = """
{{our_legal_name}} (“Party A”) and {{their_legal_name}} (“Party B”) are working together in connection with {{purpose}} (the “Purpose”). For the Purpose, the parties expect to share information that is not public and to introduce one another to contacts, counterparties, opportunities, and sources of funds. This agreement protects that information and ensures that neither party is cut out of the introductions made under it.
"""

[clauses.definitions]
heading = "Definitions"
body = """
“Confidential Information” means non-public information disclosed for the Purpose that is identified as confidential or that a reasonable recipient would understand to be confidential from its nature and circumstances. It includes protected introductions and transaction discussions. It excludes information the recipient can demonstrate was lawfully known without restriction, becomes public without breach, is independently developed without use of the information, or is lawfully received from a third party without restriction.

An “Introduction” is a written identification, for the Purpose, of a specific person or entity and opportunity by one party to the other. A “Protected Contact” is a person or entity identified in that Introduction that was not already lawfully known to the recipient in connection with that opportunity. The parties shall keep a written record of each protected introduction and its date.

“Representatives” means a party's directors, officers, employees, professional advisers and agents who need the information for the Purpose.
"""

[clauses.confidentiality]
heading = "Confidentiality"
body = """
Each Receiving Party will:

- keep the Confidential Information secret and secure, and use it only for the Purpose;
- not disclose it to anyone except as permitted under “Permitted Disclosures”;
- not copy or record it except as necessary for the Purpose; and
- protect it with no less than reasonable care.

Neither party will make any public statement about the Purpose, this agreement, or the other party’s involvement without that party’s prior written consent.
"""

[clauses.permitted_disclosures]
heading = "Permitted Disclosures"
body = """
A Receiving Party may disclose Confidential Information to Representatives who need it for the Purpose and owe equivalent confidentiality duties; the Receiving Party remains responsible for their compliance. Disclosure required by law, regulation or a competent authority is permitted to the minimum extent required, with prior notice where lawful and practicable.

Nothing restricts reporting suspected crime, protected whistleblowing, cooperation with a regulator or confidential legal advice. No consent or prior notice is required for a disclosure protected by law where imposing that requirement would restrict the protected right.
"""

[clauses.non_circumvention]
heading = "Non-Circumvention"
body = """
For {{non_circumvention_months}} months from the date of this agreement, neither party shall knowingly use a recorded Introduction or Confidential Information to bypass the introducing party in the specific opportunity described in that Introduction, with the purpose of avoiding a role or remuneration expressly agreed in writing with the introducing party. Each party remains responsible for its Representatives acting on its behalf.

This clause does not prohibit general competition, independent opportunities, pre-existing relationships or dealings unrelated to the recorded opportunity. It applies only to the extent lawful and reasonably necessary to protect the introducing party's legitimate interest; it does not create a restraint broader than that interest.
"""

[clauses.introducer_role]
heading = "Introductions and Remuneration"
body = """
Any commission or other remuneration must be expressly agreed in a separate written fee schedule specifying the payer, amount or calculation, trigger, timing and applicable taxes. The current agreed position is: {{commission_text}}. This agreement does not create an implied fee, exclusivity, authority to bind another party, or authority to undertake regulated investment, financial or other intermediary activity. Any required authorisation must be obtained before that activity begins.
"""

[clauses.prior_dealings]
heading = "Prior and Independent Contacts"
body = """
Nothing prevents a party from pursuing a contact or opportunity it can demonstrate it already knew or was independently developing before the Introduction, or subsequently obtains lawfully without using the other party's Confidential Information. Contemporaneous records may establish such circumstances.
"""

[clauses.remedies]
heading = "Remedies"
body = """
Both parties acknowledge that damages alone may not be an adequate remedy for a breach of this agreement. The injured party may seek injunctive relief and specific performance in any court of competent jurisdiction — notwithstanding the exclusive jurisdiction clause below — in addition to any other remedy.

Without limiting any other remedy, if a party concludes or facilitates a transaction in breach of the non-circumvention clause, the circumvented party may recover its proven loss from that breach, including any fee, commission, or other remuneration it can prove would, on the balance of probabilities, have been earned had that clause been complied with. There is no double recovery, and nothing in this clause limits any equitable remedy available.
"""

[clauses.no_obligation]
heading = "No Commitment, No Licence"
body = """
Neither party is obliged by this agreement to proceed with the Purpose or any transaction, or to share any particular information; either party may end discussions at any time. All Confidential Information remains the property of the Disclosing Party. No licence or other right is granted beyond the limited right to use it for the Purpose. It is provided “as is”, without warranty as to accuracy or completeness.
"""

[clauses.term]
heading = "Term and Survival"
body = """
This agreement takes effect on {{effective_date}} and continues {{term_text}}. Confidentiality duties survive for {{confidentiality_years}} years after this agreement ends, and for trade secrets while they remain protected under applicable law. The non-circumvention period is measured from the agreement date as stated in that clause and is not extended by termination. On request, Confidential Information shall be returned or deleted, except legally required records and inaccessible routine backups, which remain protected.
"""

[clauses.entire_agreement]
heading = "Entire Agreement"
body = """
This agreement is the entire agreement on its subject and supersedes earlier discussions. Nothing excludes or limits liability for fraud, fraudulent misrepresentation or any liability that cannot lawfully be excluded.
"""

[clauses.variation]
heading = "Variation and Waiver"
body = """
Changes to this agreement must be in writing and signed by both parties. A failure or delay in exercising a right is not a waiver of it.
"""

[clauses.assignment]
heading = "Assignment"
body = """
Assignment of rights requires the other party's prior written consent. Transfer of obligations requires a written novation agreed by all affected parties.
"""

[clauses.severance]
heading = "Severance"
body = """
If any provision of this agreement is or becomes invalid or unenforceable, it is deemed deleted and the rest stays in force — provided the deletion does not materially change the agreement’s overall effect.
"""

[clauses.third_party_rights]
heading = "Third-party rights"
body = """
A person who is not a party to this agreement has no right to enforce its terms, except where mandatory law provides otherwise.
"""

[clauses.notices]
heading = "Notices"
body = """
Notices must be in writing and sent to the contact email or postal address in the Parties section, or a replacement notified in writing. An email takes effect when receipt is acknowledged by the recipient, excluding automated responses. If no acknowledgement is received, the sender must use delivery with evidence of receipt. This clause does not govern service of court proceedings.
"""

[clauses.no_partnership]
heading = "No Partnership"
body = """
Nothing in this agreement creates a partnership, joint venture, agency, or employment relationship between the parties.
"""

[clauses.counterparts]
heading = "Counterparts and signatures"
body = """
This agreement may be signed in counterparts and by electronic signature where applicable law permits and all required execution formalities are met. Each signatory confirms authority to bind the party for whom they sign. A typed name recorded in administrative software is not, by itself, proof of the signatory's consent.
"""

[clauses.governing_law]
heading = "Governing Law and Jurisdiction"
body = """
This agreement, and any non-contractual obligations arising out of or in connection with it, are governed by the laws of {{governing_law}}. The parties submit to the exclusive jurisdiction of {{jurisdiction_phrase}}, except that either party may seek injunctive or protective relief in any court of competent jurisdiction.
"""
